name: Financial RAG — CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/financial-rag

jobs:

  test:
    name: Testes e cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instala dependências
        run: pip install -r requirements.txt pytest-cov

      - name: Roda testes com cobertura
        run: python -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=70
        env:
          OPENAI_API_KEY: fake-key-for-unit-tests
          REDIS_URL: ""
          CHROMA_PERSIST_DIR: /tmp/chroma_test

      - name: Publica relatório de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/

  evaluate-quality:
    name: Qualidade RAG (RAGAS)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instala dependências
        run: pip install -r requirements.txt ragas datasets

      - name: Baixa artefatos do banco vetorial (cache de produção)
        uses: actions/download-artifact@v4
        with:
          name: chroma-db-production
          path: data/chroma_db
        continue-on-error: true    # primeira vez não tem artefato ainda

      - name: Executa avaliação RAGAS
        run: python scripts/evaluate_rag.py --min-faithfulness 0.75 --min-answer-relevancy 0.70
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHROMA_PERSIST_DIR: data/chroma_db

      - name: Salva histórico de métricas
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-history
          path: data/evaluation_history.csv

  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: [test, evaluate-quality]
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrai metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=true

      - name: Build e push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max